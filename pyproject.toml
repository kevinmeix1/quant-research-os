[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-research-os"
version = "0.1.0"
description = "Autonomous AI quantitative research laboratory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
]
sibling = [
  "portfolio-agent @ file:///Users/kaiwenmei/Desktop/x11",
]
agents = [
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
]
analytics = [
  "duckdb>=1.0",
  "pyarrow>=15.0",
]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
quant = "quant_research_os.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_research_os"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
